<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa Úrsula: Cancha o Vivienda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="desktop-1">

    <!-- FONDO Y TEXTURA -->
    <img class="papel-2-icon" src="imagenes/PAPEL 2.png" alt="">

    <img class="caasa-2-icon"
         src="imagenes/CAASA 2.png"
         alt="Casas de Santa Úrsula">

    <img class="casaa-2-icon"
         src="imagenes/CASAA 2.png"
         alt="Entorno urbano">

    <!-- TÍTULO PRINCIPAL -->
    <h1 class="santa-rsula">SANTA ÚRSULA:</h1>
    <h2 class="cancha-o-vivienda">CANCHA O VIVIENDA</h2>

    <!-- MENÚ -->
    <nav class="ndice-de-navegacin" aria-label="Navegación principal">
      <a href="#desplazamiento">DESPLAZAMIENTO</a>
      <a href="#vivienda">LA VIVIENDA</a>
      <a href="#organizaciones">ORGANIZACIONES</a>
      <a class="enlace-de-participacin" href="#memoria">
        <span>MEMORIA URBANA</span>
        <span class="span">↗</span>
      </a>
    </nav>

    <!-- PIE Y BALÓN -->
    <img class="piebalon-icon"
         src="imagenes/PIEBALON.png"
         alt="Pie con tachones y balón de fútbol">

    <!-- TEXTO ROJO -->
    <p class="desplazamiento-gentrificacin" id="desplazamiento">
      DESPLAZAMIENTO, GENTRIFICACIÓN Y TENSIONES URBANAS EN SANTA
      ÚRSULA RUMBO A LA COPA DEL MUNDO
    </p>

    <!-- SEGUNDA PARTE: SILUETAS -->
    <img class="desplazaa-2-icon"
         src="imagenes/DESPLAZAA 2.png"
         alt="Siluetas de personas">

    <!-- ESTADIO -->
    <img class="eatadio-icon"
         src="imagenes/EATADIO.png"
         alt="Estadio de fútbol">

    <!-- TITULAR INFERIOR -->
    <p class="titular-de-portada">
      LA CIUDAD NO<br>ES UN ESTADIO.
    </p>

    <!-- CRÉDITO -->
    <footer class="jimena-de-la-cruz-2026-wrapper">
      JIMENA DE LA CRUZ 2026
    </footer>

  </main>
</body>
</html>
